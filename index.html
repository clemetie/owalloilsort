<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>owalloil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: #fafafa;
    color: #222;
    line-height: 1.6;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
  }

  nav {
    margin-top: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  nav a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
  }

  nav a:hover,
  nav a:focus-visible {
    background: #f0f0f0;
    color: #111;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  section {
    margin-bottom: 56px;
  }

  section h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    padding-left: 10px;
    border-left: 4px solid #111;
  }

  #profile .placeholder-box {
    background: #fff;
    border: 1px dashed #ccc;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: #999;
    font-size: 14px;
  }

  #calendar .calendar-wrap {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #eee;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }

  #calendar iframe {
    display: block;
    max-width: 100%;
  }

  .link-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-list a {
    display: block;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 14px 16px;
    text-decoration: none;
    color: #222;
    font-size: 14px;
    font-weight: 500;
    transition: border-color 0.15s, background 0.15s;
  }

  .link-list a:hover,
  .link-list a:focus-visible {
    border-color: #ccc;
    background: #f7f7f7;
  }

  #gallery .placeholder-box,
  #schedule .placeholder-box,
  #links .placeholder-box {
    background: #fff;
    border: 1px dashed #ccc;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: #999;
    font-size: 14px;
  }

  footer {
    text-align: center;
    padding: 24px;
    color: #aaa;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>Owalloil</h1>
  <nav>
    <a href="#profile">소개</a>
    <a href="#calendar">캘린더</a>
    <a href="#schedule">일정</a>
  </nav>
</header>

<main>

  <section id="profile">
    <h2>Owalloil SNS</h2>
    <ul class="link-list">
      <li><a href="https://www.instagram.com/owalloil_official/" target="_blank" rel="noopener">📷 인스타그램 (@owalloil_official)</a></li>
      <li><a href="https://www.youtube.com/channel/UCctIiky5oowTJH8Kr678Uqg" target="_blank" rel="noopener">▶️ 유튜브 (오월오일 OWALLOIL)</a></li>
    </ul>
  </section>

  <section id="calendar">
    <h2>캘린더</h2>
    <div class="calendar-wrap">
      <iframe src="https://calendar.google.com/calendar/embed?src=nunguleum093%40gmail.com&ctz=Asia%2FSeoul" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>
    </div>
  </section>

  <section id="schedule">
    <h2>일정 요약</h2>
    <div class="placeholder-box">
      다가오는 스케줄이나 이벤트를 정리해서 보여줄 영역입니다.
    </div>
  </section>


</main>

<footer>
  made with 💛
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덕질 사이트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: #fafafa;
    color: #222;
    line-height: 1.6;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
  }

  nav {
    margin-top: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  nav a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
  }

  nav a:hover,
  nav a:focus-visible {
    background: #f0f0f0;
    color: #111;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  section {
    margin-bottom: 56px;
  }

  section h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    padding-left: 10px;
    border-left: 4px solid #111;
  }

  #profile .placeholder-box {
    background: #fff;
    border: 1px dashed #ccc;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: #999;
    font-size: 14px;
  }

  #calendar .calendar-wrap {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #eee;
  }

  #calendar iframe {
    display: block;
    width: 100%;
    height: 600px;
    border: 0;
  }

  #gallery .placeholder-box,
  #schedule .placeholder-box,
  #links .placeholder-box {
    background: #fff;
    border: 1px dashed #ccc;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: #999;
    font-size: 14px;
  }

  footer {
    text-align: center;
    padding: 24px;
    color: #aaa;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>🌟 덕질 사이트</h1>
  <nav>
    <a href="#profile">소개</a>
    <a href="#calendar">캘린더</a>
    <a href="#schedule">일정</a>
    <a href="#gallery">갤러리</a>
    <a href="#links">링크</a>
  </nav>
</header>

<main>

  <section id="profile">
    <h2>소개</h2>
    <div class="placeholder-box">
      여기에 프로필/소개 내용이 들어갈 예정입니다.
    </div>
  </section>

  <section id="calendar">
    <h2>캘린더</h2>
    <div class="calendar-wrap">
      <!--
        아래 iframe의 src를 본인의 구글 캘린더 공개 embed 주소로 교체하세요.
        구글 캘린더 > 설정 > 해당 캘린더 > "캘린더 통합" > "퍼가기 코드"에서
        src="..." 부분만 복사해서 넣으면 됩니다.
      -->
      <iframe
        src="https://calendar.google.com/calendar/embed?src=ko.south_korea%23holiday%40group.v.calendar.google.com&ctz=Asia%2FSeoul"
        title="구글 캘린더"
        loading="lazy">
      </iframe>
    </div>
  </section>

  <section id="schedule">
    <h2>일정 요약</h2>
    <div class="placeholder-box">
      다가오는 스케줄이나 이벤트를 정리해서 보여줄 영역입니다.
    </div>
  </section>

  <section id="gallery">
    <h2>갤러리</h2>
    <div class="placeholder-box">
      사진/영상 등을 모아둘 영역입니다.
    </div>
  </section>

  <section id="links">
    <h2>관련 링크</h2>
    <div class="placeholder-box">
      SNS, 팬카페, 공식 사이트 등 링크 모음이 들어갈 영역입니다.
    </div>
  </section>

</main>

<footer>
  made with 💛
</footer>

</body>
</html>

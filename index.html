<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덕질 사이트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: #fafafa;
    color: #222;
    line-height: 1.6;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
  }

  nav {
    margin-top: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  nav a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
  }

  nav a:hover,
  nav a:focus-visible {
    background: #f0f0f0;
    color: #111;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  section {
    margin-bottom: 56px;
  }

  section h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    padding-left: 10px;
    border-left: 4px solid #111;
  }

  .sns-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sns-row a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 999px;
    padding: 10px 18px;
    text-decoration: none;
    color: #222;
    font-size: 14px;
    font-weight: 500;
    transition: border-color 0.15s, background 0.15s;
  }

  .sns-row a:hover,
  .sns-row a:focus-visible {
    border-color: #ccc;
    background: #f7f7f7;
  }

  #calendar .calendar-wrap {
    display: flex;
    justify-content: center;
  }

  #calendar iframe {
    display: block;
    max-width: 100%;
    border-radius: 8px;
  }

  .schedule-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .schedule-list li {
    display: flex;
    gap: 16px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 14px 16px;
  }

  .schedule-date {
    flex-shrink: 0;
    width: 64px;
    font-size: 13px;
    font-weight: 700;
    color: #666;
  }

  .schedule-body .schedule-title {
    font-size: 14px;
    font-weight: 600;
  }

  .schedule-body .schedule-desc {
    font-size: 13px;
    color: #888;
    margin-top: 2px;
  }

  .schedule-loading,
  .schedule-empty {
    color: #999;
    font-size: 14px;
    background: #fff;
    border: 1px dashed #ccc;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }

  footer {
    text-align: center;
    padding: 24px;
    color: #aaa;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>🌟 덕질 사이트</h1>
  <nav>
    <a href="#calendar">캘린더</a>
    <a href="#schedule">일정</a>
  </nav>
</header>

<main>

  <section id="sns">
    <div class="sns-row">
      <a href="https://www.instagram.com/owalloil_official/" target="_blank" rel="noopener">📷 인스타그램</a>
      <a href="https://www.youtube.com/channel/UCctIiky5oowTJH8Kr678Uqg" target="_blank" rel="noopener">▶️ 유튜브</a>
    </div>
  </section>

  <section id="calendar">
    <h2>캘린더</h2>
    <div class="calendar-wrap">
      <iframe src="https://calendar.google.com/calendar/embed?src=nunguleum093%40gmail.com&ctz=Asia%2FSeoul" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>
    </div>
  </section>

  <section id="schedule">
    <h2>일정 요약</h2>
    <ul class="schedule-list" id="schedule-list">
      <li class="schedule-loading">일정을 불러오는 중...</li>
    </ul>
  </section>

</main>

<footer>
  made with 💛
</footer>

<script>
  const GOOGLE_API_KEY = 'AIzaSyCizEquK5yjfW7yRGogF0_yRvOgmQRNrKw';
  const CALENDAR_ID = 'nunguleum093@gmail.com';

  async function loadSchedule() {
    const listEl = document.getElementById('schedule-list');
    const now = new Date().toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
      + `?key=${GOOGLE_API_KEY}&timeMin=${encodeURIComponent(now)}&singleEvents=true&orderBy=startTime&maxResults=10`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('요청 실패: ' + res.status);
      const data = await res.json();
      renderSchedule(listEl, data.items || []);
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<li class="schedule-empty">일정을 불러오지 못했습니다. API 키/캘린더 설정을 확인해주세요.</li>';
    }
  }

  function renderSchedule(listEl, events) {
    if (events.length === 0) {
      listEl.innerHTML = '<li class="schedule-empty">다가오는 일정이 없습니다.</li>';
      return;
    }

    listEl.innerHTML = events.map(function (ev) {
      const rawStart = ev.start.dateTime || ev.start.date;
      const startDate = new Date(rawStart);
      const dateLabel = (startDate.getMonth() + 1) + '.' + startDate.getDate();
      const title = ev.summary || '(제목 없음)';
      const desc = ev.location || ev.description || '';

      return '<li>'
        + '<div class="schedule-date">' + dateLabel + '</div>'
        + '<div class="schedule-body">'
        + '<div class="schedule-title">' + escapeHtml(title) + '</div>'
        + '<div class="schedule-desc">' + escapeHtml(desc) + '</div>'
        + '</div>'
        + '</li>';
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.addEventListener('DOMContentLoaded', loadSchedule);
</script>

</body>

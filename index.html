   <div id="result"></div> <script>

  { title: "As all", id: "nWwwQ2EI8GY" },
  { title: "Run", id: "L71TzVM_Xog" },
  
];

let shuffled = [...songs].sort(() => Math.random() - 0.5);
let current = 0;
let next = 1;
let winners = [];
let ranking = [];

function getThumb(id) {
  return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
}

function renderThumb(targetId, song) {
  document.getElementById(targetId).innerHTML = `
    <img src="${getThumb(song.id)}">
    <div class="play">▶</div>
  `;
}

function showMatch() {
  if (next >= shuffled.length) {
    if (winners.length === 1) {
      ranking.unshift(winners[0]);

      let html = `
        <h2>🏆 전체 순위</h2>
        <table style="
          margin: 20px auto;
          border-collapse: collapse;
          width: 300px;
          background: white;
          box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        ">
          <tr style="background:#333; color:white;">
            <th style="padding:8px; border:1px solid #ddd;">순위</th>
            <th style="padding:8px; border:1px solid #ddd;">곡 제목</th>
          </tr>
      `;

      ranking.forEach((song, i) => {
        html += `
          <tr style="background:${i % 2 === 0 ? '#fff' : '#f2f2f2'};">
            <td style="padding:8px; border:1px solid #ddd; text-align:center;">
              ${i+1}
            </td>
            <td style="padding:8px; border:1px solid #ddd;">
              ${i === 0 ? "👑 " : ""}${song.title}
            </td>
          </tr>
        `;
      });

      html += `</table>`;

      document.getElementById("result").innerHTML = html;
      return;
    }

    shuffled = winners;
    winners = [];
    current = 0;
    next = 1;
  }

  document.getElementById("round").innerText =
    `Round (${shuffled.length}강)`;

  renderThumb("leftPlayer", shuffled[current]);
  renderThumb("rightPlayer", shuffled[next]);

  document.getElementById("leftTitle").innerText = shuffled[current].title;
  document.getElementById("rightTitle").innerText = shuffled[next].title;
}

function playVideo(side) {
  const song = side === 0 ? shuffled[current] : shuffled[next];
  const target = side === 0 ? "leftPlayer" : "rightPlayer";

  document.getElementById(target).innerHTML = `
    <iframe width="100%" height="160"
      src="https://www.youtube.com/embed/${song.id}?autoplay=1"
      allow="autoplay"
      allowfullscreen></iframe>
  `;
}

function pick(choice) {
  let loser;

  if (choice === 0) {
    winners.push(shuffled[current]);
    loser = shuffled[next];
  } else if (choice === 1) {
    winners.push(shuffled[next]);
    loser = shuffled[current];
  } else {
    const win = Math.random() > 0.5 ? current : next;
    const lose = win === current ? next : current;
    winners.push(shuffled[win]);
    loser = shuffled[lose];
  }

  ranking.unshift(loser);

  current += 2;
  next += 2;

  showMatch();
}

showMatch();
</script> </h3>

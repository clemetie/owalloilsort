<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>오월오일 노래 소트</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background-color: #90E0EF;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
}

.card {
  width: 280px;
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.player {
  width: 100%;
  height: 160px;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
}

.player img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 40px;
  color: white;
}

.title {
  margin-top: 8px;
  font-weight: bold;
}

button {
  margin-top: 10px;
  padding: 8px 18px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: white;
  cursor: pointer;
}

.extra-buttons {
  margin-top: 20px;
}

#result {
  margin-top: 30px;
  padding: 20px;
  background: #90E0EF;
  border-radius: 16px;
}

/* 테이블 스타일 */
table {
  margin: 20px auto;
  border-collapse: collapse;
  width: 320px;
  background: #ffffff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

th {
  background: #222;
  color: #fff;
  padding: 6px;
}

td {
  padding: 6px;
}

tr:nth-child(even) {
  background: #f5f7f8;
}
</style>
</head>

<body>

<h1>오월오일 노래 소트</h1>
<p>26.03.29. @withardor<p>
<div id="round"></div>

<div class="container">
  <div class="card">
    <div class="player" id="leftPlayer" onclick="playVideo(0)"></div>
    <div class="title" id="leftTitle"></div>
    <button onclick="pick(0)">선택</button>
  </div>

  <div class="card">
    <div class="player" id="rightPlayer" onclick="playVideo(1)"></div>
    <div class="title" id="rightTitle"></div>
    <button onclick="pick(1)">선택</button>
  </div>
</div>

<div class="extra-buttons">
  <button onclick="pick(3)">💖 둘 다 좋다</button>
  <button onclick="pick(2)">🤷 모르겠다</button>
</div>
<button id="saveBtn" onclick="saveImage()" style="display:none;">
  📸 결과 이미지 저장
</button>

<div id="capture">
  <div id="result"></div>
</div>


<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

const songs = [
  { title: "손", id: "fWgZLZmM6Jg", score: 0, match: 0 },
  { title: "Rooftop", id: "RP3DgYjdvAo", score: 0, match: 0 },
  { title: "leaves", id: "N9HlPFynvPY", score: 0, match: 0 },
  { title: "Harvest Day", id: "lbzaSpGVzzE", score: 0, match: 0 },
  { title: "Look my moon", id: "6baXyNcL2xg", score: 0, match: 0 },
  { title: "Cherry roman candle", id: "yYFkhUiwk4k", score: 0, match: 0 },
  { title: "I dare you", id: "Kh7lsMEj3vk", score: 0, match: 0 },
  { title: "Warrior", id: "F5BQldYHFLQ", score: 0, match: 0 },
  { title: "London time", id: "Sx_8sO8Tm_M", score: 0, match: 0 },
  { title: "Creaminal", id: "jd5SQvyHPLU", score: 0, match: 0 },
  { title: "Scentria forest", id: "Umf0HCXFZY8", score: 0, match: 0 },
  { title: "Tree", id: "eT54rGmRvLQ", score: 0, match: 0 },
  { title: "She said", id: "SNH4lJiOUrw", score: 0, match: 0 },
  { title: "봉숭아", id: "3E_ZWX8M2Gs", score: 0, match: 0 },
  { title: "SSY", id: "2UDTlxQJ498", score: 0, match: 0 },
  { title: "Magic train", id: "P9YUwP-eqmk", score: 0, match: 0 },
  { title: "노란세상", id: "HxxBU0AtrHs", score: 0, match: 0 },
  { title: "Young adult", id: "BcG_lkNmKBg", score: 0, match: 0 },
  { title: "Echo", id: "zBfQC_GcIvM", score: 0, match: 0 },
  { title: "Wish", id: "t54PzeNJDIA", score: 0, match: 0 },
  { title: "샴수사바", id: "FUbFlQczycM", score: 0, match: 0 },
  { title: "Lunch time", id: "iWtPhKNOgcU", score: 0, match: 0 },
  { title: "Last dance", id: "Yyg6um1GIRE", score: 0, match: 0 },
  { title: "Vivid nightmare", id: "Ti2CKdnGCNs", score: 0, match: 0 },
  { title: "나를 싫어했던 사람들에게", id: "-cMIXDH4NOA", score: 0, match: 0 },
  { title: "Merry go round", id: "0dc3mnBAZEY", score: 0, match: 0 },
  { title: "잠자리,풀,옆", id: "oveiQ6wKryQ", score: 0, match: 0 },
  { title: "유전", id: "ogbayM7pyzs", score: 0, match: 0 },
  { title: "Before summer night", id: "hCUWt05urio", score: 0, match: 0 },
  { title: "청춘", id: "UxiA_QlV4Es", score: 0, match: 0 },
  { title: "구기동과 반딧불이", id: "Bw56tiQJyuk", score: 0, match: 0 },
  { title: "We don't stop now", id: "ZQ6SVj9sAFI", score: 0, match: 0 },
  { title: "Epilogue", id: "ASWYLoCJw4g", score: 0, match: 0 },
  { title: "In the forest", id: "sk-vpbJ8AuI", score: 0, match: 0 },
  { title: "바라보는걸", id: "SkHlUo6iLaw", score: 0, match: 0 },
  { title: "Lonesome", id: "hpJXpGx2QgQ", score: 0, match: 0 },
  { title: "이에르", id: "rsNZvUmIvc0", score: 0, match: 0 },
  { title: "유월의 낮", id: "KxsZev7ErZo", score: 0, match: 0 },
  { title: "별 빛이 내린다", id: "W8jeAJXMBJw", score: 0, match: 0 },
  { title: "여름밤의 꿈", id: "ck1Tl27VRfE", score: 0, match: 0 },
  { title: "spirit", id: "htMmco-iFtc", score: 0, match: 0 },
  { title: "Sak", id: "1Il4wEMYWAM", score: 0, match: 0 },
  { title: "I Met My Friend In The Water", id: "FmnKrdygkKM", score: 0, match: 0 },
  { title: "우리 마주한 이 자리가", id: "3X9--5_0JBs", score: 0, match: 0 },
  { title: "As all", id: "nWwwQ2EI8GY", score: 0, match: 0 },
  { title: "Run", id: "L71TzVM_Xog", score: 0, match: 0 },
  { title: "이 도시는", id: "MKIDOE7BxUE", score: 0, match: 0 },
];

let totalRounds = songs.length + 30;
let currentRound = 0;

let current, next;

let firstRoundQueue = [...songs.keys()].sort(() => Math.random() - 0.5);
let firstRoundDone = false;

function getThumb(id) {
  return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
}

function renderThumb(targetId, song) {
  document.getElementById(targetId).innerHTML =
    `<img src="${getThumb(song.id)}"><div class="play">▶</div>`;
}

function showMatch() {
  if (currentRound >= totalRounds) return showResult();

  currentRound++;

  if (!firstRoundDone) {
    if (firstRoundQueue.length === 1) {
      current = firstRoundQueue.pop();
      next = Math.floor(Math.random() * songs.length);
      firstRoundDone = true;
    } else if (firstRoundQueue.length === 0) {
      firstRoundDone = true;
      return showMatch();
    } else {
      current = firstRoundQueue.pop();
      next = firstRoundQueue.pop();
    }
  } else {
    let a = Math.floor(Math.random() * songs.length);
    let b;
    do {
      b = Math.floor(Math.random() * songs.length);
    } while (a === b);

    current = a;
    next = b;
  }

  songs[current].match++;
  songs[next].match++;

  document.getElementById("round").innerText =
    `🔥 ${totalRounds - currentRound}번 남음`;

  renderThumb("leftPlayer", songs[current]);
  renderThumb("rightPlayer", songs[next]);

  document.getElementById("leftTitle").innerText = songs[current].title;
  document.getElementById("rightTitle").innerText = songs[next].title;
}

function playVideo(side) {
  const song = side === 0 ? songs[current] : songs[next];
  const target = side === 0 ? "leftPlayer" : "rightPlayer";

  document.getElementById(target).innerHTML =
    `<iframe width="100%" height="160"
      src="https://www.youtube.com/embed/${song.id}?autoplay=1"
      allow="autoplay" allowfullscreen></iframe>`;
}

function pick(choice) {
  if (choice === 0) songs[current].score++;
  else if (choice === 1) songs[next].score++;
  else if (choice === 2) {
    const win = Math.random() > 0.5 ? current : next;
    songs[win].score++;
  } else {
    songs[current].score++;
    songs[next].score++;
  }
  showMatch();
}

function showResult() {
  const sorted = [...songs].sort((a, b) => {
    if (b.score !== a.score) return b.score - a.score;
    return b.match - a.match;
  });

  document.getElementById("saveBtn").style.display = "inline-block";

  let html = `<h2>🏆 전체 순위</h2>
  <table>
  <tr>
    <th>순위</th><th>곡 제목</th><th>선택</th>
  </tr>`;

  let rank = 1;

  sorted.forEach((s, i) => {
    if (i > 0 && s.score !== sorted[i - 1].score) {
      rank = i + 1;
    }

    html += `<tr style="${rank === 1 ? 'background:#ffe066; font-weight:bold;' : ''}">
      <td>${rank}</td>
      <td>${rank === 1 ? "👑 " : ""}${s.title}</td>
      <td>${s.score}</td>
    </tr>`;
  });

  html += `</table>`;
  document.getElementById("result").innerHTML = html;
}

function saveImage() {
  html2canvas(document.getElementById("capture"), {
    backgroundColor: "#ffffff"
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "오월오일 노래 소트.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}

showMatch();

</script>
</body>
</html>

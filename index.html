<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오월오일</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: #f2f8ff;
    color: #222;
    line-height: 1.6;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
  }

  .header-logo {
    display: block;
    height: 64px;
    width: auto;
  }

  nav {
    margin-top: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  nav a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
  }

  nav a:hover,
  nav a:focus-visible {
    background: #f0f0f0;
    color: #111;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  section {
    margin-bottom: 56px;
  }

  section h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    padding-left: 10px;
    border-left: 4px solid #111;
  }

  .icon-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .icon-row a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    transition: transform 0.15s, opacity 0.15s;
  }

  .icon-row a:hover,
  .icon-row a:focus-visible {
    transform: translateY(-2px);
    opacity: 0.8;
  }

  .icon-row img {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: block;
  }

  #calendar .calendar-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 20px;
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .cal-header .cal-title {
    font-size: 15px;
    font-weight: 700;
  }

  .cal-nav-btn {
    border: none;
    background: #f5f5f5;
    color: #333;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cal-nav-btn:hover {
    background: #eee;
  }

  .cal-weekdays,
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .cal-weekdays span {
    text-align: center;
    font-size: 11px;
    color: #aaa;
    padding-bottom: 8px;
  }

  .cal-day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #333;
    border-radius: 8px;
  }

  .cal-day.has-event {
    cursor: pointer;
  }

  .cal-day.has-event:hover {
    background: #f5f5f5;
  }

  .cal-day.is-selected {
    background: #eee;
    font-weight: 700;
  }

  .cal-day-detail {
    margin-top: 14px;
    border-top: 1px solid #eee;
    padding-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cal-day-detail .cal-event-item {
    background: #fafafa;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 10px 12px;
  }

  .cal-day-detail .cal-event-title {
    font-size: 13px;
    font-weight: 600;
  }

  .cal-day-detail .cal-event-time {
    font-size: 11px;
    color: #999;
    margin-top: 2px;
  }

  .cal-day-detail .cal-event-desc {
    font-size: 12px;
    color: #888;
    margin-top: 4px;
  }

  .cal-day.is-empty {
    visibility: hidden;
  }

  .cal-day.is-today {
    background: #fff7e6;
    font-weight: 700;
  }

  .cal-day .cal-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #e0a300;
    margin-top: 3px;
  }

  .cal-loading {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    padding: 12px 0;
  }

  .schedule-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .schedule-list li {
    display: flex;
    gap: 12px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px 14px;
  }

  .schedule-date {
    flex-shrink: 0;
    width: 52px;
    font-size: 12px;
    font-weight: 700;
    color: #666;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .schedule-time {
    font-size: 11px;
    font-weight: 500;
    color: #aaa;
  }

  .schedule-body {
    min-width: 0;
  }

  .schedule-body .schedule-title {
    font-size: 13px;
    font-weight: 600;
    word-break: break-word;
  }

  .schedule-body .schedule-desc {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
    word-break: break-word;
  }

  .schedule-body .schedule-desc a {
    color: #888;
  }

  @media (max-width: 480px) {
    .schedule-date {
      width: 46px;
      font-size: 11px;
    }

    .schedule-time {
      font-size: 10px;
    }

    .schedule-body .schedule-title {
      font-size: 12px;
    }

    .schedule-body .schedule-desc {
      font-size: 11px;
    }
  }

  .schedule-loading,
  .schedule-empty {
    color: #999;
    font-size: 14px;
    background: #fff;
    border: 1px dashed #ccc;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }

  .setlist-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 14px;
    font-size: 13px;
    color: #666;
  }

  .pager-btn {
    border: none;
    background: #f5f5f5;
    color: #333;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pager-btn:hover:not(:disabled) {
    background: #eee;
  }

  .pager-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .setlist-item {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 4px 16px;
  }

  .setlist-item summary {
    cursor: pointer;
    list-style: none;
    padding: 14px 0;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .setlist-item summary::-webkit-details-marker {
    display: none;
  }

  .setlist-item summary::after {
    content: '+';
    flex-shrink: 0;
    font-size: 16px;
    font-weight: 400;
    color: #999;
    transition: transform 0.15s;
  }

  .setlist-item[open] summary::after {
    content: '−';
  }

  .setlist-item summary .setlist-date {
    color: #999;
    font-weight: 500;
    margin-right: 8px;
  }

  .setlist-songs {
    list-style: decimal;
    padding: 0 0 16px 20px;
    font-size: 13px;
    color: #444;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  footer {
    text-align: center;
    padding: 24px;
    color: #aaa;
    font-size: 12px;
  }
</style>
</head>

<script>
  const GOOGLE_API_KEY = 'AIzaSyCizEquK5yjfW7yRGogF0_yRvOgmQRNrKw';
  const CALENDAR_ID = 'nunguleum093@gmail.com';

  const SCHEDULE_PAGE_SIZE = 5;
  let scheduleEvents = [];
  let schedulePage = 1;

  async function loadSchedule() {
    const listEl = document.getElementById('schedule-list');
    const now = new Date().toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
      + `?key=${GOOGLE_API_KEY}&timeMin=${encodeURIComponent(now)}&singleEvents=true&orderBy=startTime&maxResults=50`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('요청 실패: ' + res.status);
      const data = await res.json();
      scheduleEvents = data.items || [];
      schedulePage = 1;
      renderSchedulePage();
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<li class="schedule-empty">일정을 불러오지 못했습니다. API 키/캘린더 설정을 확인해주세요.</li>';
    }
  }

  function renderSchedulePage() {
    const listEl = document.getElementById('schedule-list');
    const pagerEl = document.getElementById('schedule-pager');

    if (scheduleEvents.length === 0) {
      listEl.innerHTML = '<li class="schedule-empty">다가오는 일정이 없습니다.</li>';
      pagerEl.style.display = 'none';
      return;
    }

    const totalPages = Math.ceil(scheduleEvents.length / SCHEDULE_PAGE_SIZE);
    const start = (schedulePage - 1) * SCHEDULE_PAGE_SIZE;
    const pageEvents = scheduleEvents.slice(start, start + SCHEDULE_PAGE_SIZE);

    listEl.innerHTML = pageEvents.map(function (ev) {
      const rawStart = ev.start.dateTime || ev.start.date;
      const startDate = new Date(rawStart);
      const dateLabel = (startDate.getMonth() + 1) + '.' + startDate.getDate();
      const isAllDay = !ev.start.dateTime;
      const timeLabel = isAllDay ? '종일' : startDate.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
      const title = ev.summary || '(제목 없음)';
      const desc = ev.location || ev.description || '';

      return '<li>'
        + '<div class="schedule-date">' + dateLabel + '<span class="schedule-time">' + timeLabel + '</span></div>'
        + '<div class="schedule-body">'
        + '<div class="schedule-title">' + escapeHtml(title) + '</div>'
        + '<div class="schedule-desc">' + desc + '</div>'
        + '</div>'
        + '</li>';
    }).join('');

    if (totalPages <= 1) {
      pagerEl.style.display = 'none';
      return;
    }

    pagerEl.style.display = 'flex';
    pagerEl.innerHTML = '<button class="pager-btn" id="schedule-prev"' + (schedulePage === 1 ? ' disabled' : '') + '>‹</button>'
      + '<span>' + schedulePage + ' / ' + totalPages + '</span>'
      + '<button class="pager-btn" id="schedule-next"' + (schedulePage === totalPages ? ' disabled' : '') + '>›</button>';

    document.getElementById('schedule-prev').addEventListener('click', function () {
      if (schedulePage > 1) { schedulePage -= 1; renderSchedulePage(); }
    });
    document.getElementById('schedule-next').addEventListener('click', function () {
      if (schedulePage < totalPages) { schedulePage += 1; renderSchedulePage(); }
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.addEventListener('DOMContentLoaded', loadSchedule);

  let calViewYear = new Date().getFullYear();
  let calViewMonth = new Date().getMonth();
  let calEventsByDay = {};

  async function loadCalendarMonth(year, month) {
    const gridEl = document.getElementById('cal-grid');
    const titleEl = document.getElementById('cal-title');
    const loadingEl = document.getElementById('cal-loading');
    const detailEl = document.getElementById('cal-day-detail');

    titleEl.textContent = year + '년 ' + (month + 1) + '월';
    loadingEl.style.display = 'block';
    detailEl.style.display = 'none';
    detailEl.innerHTML = '';

    const timeMin = new Date(year, month, 1).toISOString();
    const timeMax = new Date(year, month + 1, 1).toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
      + `?key=${GOOGLE_API_KEY}&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime&maxResults=100`;

    calEventsByDay = {};
    try {
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        (data.items || []).forEach(function (ev) {
          const raw = ev.start.dateTime || ev.start.date;
          const d = new Date(raw);
          const day = d.getDate();
          if (!calEventsByDay[day]) calEventsByDay[day] = [];
          calEventsByDay[day].push(ev);
        });
      }
    } catch (err) {
      console.error(err);
    }

    loadingEl.style.display = 'none';
    renderCalendarGrid(gridEl, year, month, calEventsByDay);
  }

  function renderCalendarGrid(gridEl, year, month, eventsByDay) {
    const firstDayIndex = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

    let html = '';
    for (let i = 0; i < firstDayIndex; i++) {
      html += '<div class="cal-day is-empty"></div>';
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const hasEvent = !!eventsByDay[day];
      const isToday = isCurrentMonth && today.getDate() === day;
      html += '<div class="cal-day' + (isToday ? ' is-today' : '') + (hasEvent ? ' has-event' : '') + '" data-day="' + day + '">'
        + day
        + (hasEvent ? '<span class="cal-dot"></span>' : '')
        + '</div>';
    }

    gridEl.innerHTML = html;
  }

  function showDayDetail(day) {
    const detailEl = document.getElementById('cal-day-detail');
    const events = calEventsByDay[day];

    document.querySelectorAll('#cal-grid .cal-day').forEach(function (el) {
      el.classList.toggle('is-selected', el.dataset.day === String(day));
    });

    if (!events || events.length === 0) {
      detailEl.style.display = 'none';
      detailEl.innerHTML = '';
      return;
    }

    detailEl.innerHTML = events.map(function (ev) {
      const rawStart = ev.start.dateTime || ev.start.date;
      const startDate = new Date(rawStart);
      const isAllDay = !ev.start.dateTime;
      const timeLabel = isAllDay ? '종일' : startDate.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
      const title = ev.summary || '(제목 없음)';
      const desc = ev.location || ev.description || '';

      return '<div class="cal-event-item">'
        + '<div class="cal-event-title">' + escapeHtml(title) + '</div>'
        + '<div class="cal-event-time">' + timeLabel + '</div>'
        + (desc ? '<div class="cal-event-desc">' + desc + '</div>' : '')
        + '</div>';
    }).join('');

    detailEl.style.display = 'flex';
  }

  document.getElementById('cal-grid').addEventListener('click', function (e) {
    const dayEl = e.target.closest('.cal-day.has-event');
    if (!dayEl) return;
    showDayDetail(dayEl.dataset.day);
  });

  document.getElementById('cal-prev').addEventListener('click', function () {
    calViewMonth -= 1;
    if (calViewMonth < 0) { calViewMonth = 11; calViewYear -= 1; }
    loadCalendarMonth(calViewYear, calViewMonth);
  });

  document.getElementById('cal-next').addEventListener('click', function () {
    calViewMonth += 1;
    if (calViewMonth > 11) { calViewMonth = 0; calViewYear += 1; }
    loadCalendarMonth(calViewYear, calViewMonth);
  });

  document.addEventListener('DOMContentLoaded', function () {
    loadCalendarMonth(calViewYear, calViewMonth);
  });

    { date: '25.07.09', title: '튠업 26기 선정 공연', songs: ['Young adult','Echo','Scentria forest','Wish','Merry go round','London time','Tree','Cherry roman candle','Lunch time'] },

  const SETLIST_PAGE_SIZE = 5;
  let setlistPage = 1;
  const SETLISTS_SORTED = SETLISTS.slice().reverse();

  function renderSetlists() {
    const containerEl = document.getElementById('setlist-container');
    const pagerEl = document.getElementById('setlist-pager');
    const totalPages = Math.ceil(SETLISTS_SORTED.length / SETLIST_PAGE_SIZE);
    const start = (setlistPage - 1) * SETLIST_PAGE_SIZE;
    const pageShows = SETLISTS_SORTED.slice(start, start + SETLIST_PAGE_SIZE);

    containerEl.innerHTML = pageShows.map(function (show) {
      const songsHtml = show.songs.map(function (song) {
        return '<li>' + escapeHtml(song) + '</li>';
      }).join('');

      return '<details class="setlist-item">'
        + '<summary><span><span class="setlist-date">' + escapeHtml(show.date) + '</span>' + escapeHtml(show.title) + '</span></summary>'
        + '<ol class="setlist-songs">' + songsHtml + '</ol>'
        + '</details>';
    }).join('');

    if (totalPages <= 1) {
      pagerEl.style.display = 'none';
      return;
    }

    pagerEl.style.display = 'flex';
    pagerEl.innerHTML = '<button class="pager-btn" id="setlist-prev"' + (setlistPage === 1 ? ' disabled' : '') + '>‹</button>'
      + '<span>' + setlistPage + ' / ' + totalPages + '</span>'
      + '<button class="pager-btn" id="setlist-next"' + (setlistPage === totalPages ? ' disabled' : '') + '>›</button>';

    document.getElementById('setlist-prev').addEventListener('click', function () {
      if (setlistPage > 1) { setlistPage -= 1; renderSetlists(); }
    });
    document.getElementById('setlist-next').addEventListener('click', function () {
      if (setlistPage < totalPages) { setlistPage += 1; renderSetlists(); }
    });
  }

  document.addEventListener('DOMContentLoaded', renderSetlists);
</script>

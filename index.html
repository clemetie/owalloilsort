<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>오월오일 노래 월드컵</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #D3E6F8;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
}

.card {
  width: 280px;
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.player {
  width: 100%;
  height: 160px;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
}

.player img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 40px;
  color: white;
}

.title {
  margin-top: 8px;
  font-weight: bold;
}

button {
  margin-top: 10px;
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: white;
  cursor: pointer;
}

.extra-buttons {
  margin-top: 20px;
}

#result {
  margin-top: 30px;
}

h3 {
  font-weight: 300;
}
</style>
</head>

<body>

<h1>오월오일 노래 월드컵</h1>
<h3>2026.03.29 @withardor</h3>

<div id="round"></div>

<div class="container">
  <div class="card">
    <div class="player" id="leftPlayer" onclick="playVideo(0)"></div>
    <div class="title" id="leftTitle"></div>
    <button onclick="pick(0)">선택</button>
  </div>

  <div class="card">
    <div class="player" id="rightPlayer" onclick="playVideo(1)"></div>
    <div class="title" id="rightTitle"></div>
    <button onclick="pick(1)">선택</button>
  </div>
</div>

<div class="extra-buttons">
  <button onclick="pick(3)">💖 둘 다 좋다</button>
  <button onclick="pick(2)">🤷 모르겠다</button>
</div>

<div id="result"></div>

<script>

// 🎵 곡 리스트
const songs = [
  { title: "손", id: "fWgZLZmM6Jg", score: 0, match: 0 },

  { title: "샴수사바", id: "FUbFlQczycM", score: 0, match: 0 },
  { title: "Lunch time", id: "iWtPhKNOgcU", score: 0, match: 0 },

  { title: "Merry go round", id: "0dc3mnBAZEY", score: 0, match: 0 },
  { title: "잠자리,풀,옆", id: "oveiQ6wKryQ", score: 0, match: 0 },
  { title: "유전", id: "ogbayM7pyzs", score: 0, match: 0 },
  { title: "Before summer night", id: "hCUWt05urio", score: 0, match: 0 },
  { title: "청춘", id: "UxiA_QlV4Es", score: 0, match: 0 },
  { title: "구기동과 반딧불이", id: "Bw56tiQJyuk", score: 0, match: 0 },
  { title: "We don't stop now", id: "ZQ6SVj9sAFI", score: 0, match: 0 },
  { title: "Epilogue", id: "ASWYLoCJw4g", score: 0, match: 0 },
  { title: "In the forest", id: "sk-vpbJ8AuI", score: 0, match: 0 },
  { title: "바라보는걸", id: "SkHlUo6iLaw", score: 0, match: 0 },
  { title: "Lonesome", id: "hpJXpGx2QgQ", score: 0, match: 0 },
  { title: "이에르", id: "rsNZvUmIvc0", score: 0, match: 0 },
  { title: "유월의 낮", id: "KxsZev7ErZo", score: 0, match: 0 },
  { title: "별 빛이 내린다", id: "W8jeAJXMBJw", score: 0, match: 0 },
  { title: "여름밤의 꿈", id: "ck1Tl27VRfE", score: 0, match: 0 },
  { title: "spirit", id: "htMmco-iFtc", score: 0, match: 0 },
  { title: "Sak", id: "1Il4wEMYWAM", score: 0, match: 0 },
  { title: "I Met My Friend In The Water", id: "FmnKrdygkKM", score: 0, match: 0 },
  { title: "우리 마주한 이 자리가", id: "3X9--5_0JBs", score: 0, match: 0 },
  { title: "As all", id: "nWwwQ2EI8GY", score: 0, match: 0 },
  { title: "Run", id: "L71TzVM_Xog", score: 0, match: 0 },
  { title: "이 도시는", id: "MKIDOE7BxUE", score: 0, match: 0 },
  { title: "봉숭아 (Acoustic ver.)", id: "ZCIDsK94WZM", score: 0, match: 0 },
];

let totalRounds = songs.length + 30;
let currentRound = 0;

let current, next;

let firstRoundQueue = [...songs.keys()].sort(() => Math.random() - 0.5);
let firstRoundDone = false;

function getThumb(id) {
  return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
}

function renderThumb(targetId, song) {
  document.getElementById(targetId).innerHTML = `
    <img src="${getThumb(song.id)}">
    <div class="play">▶</div>
  `;
}

function showMatch() {
  if (currentRound >= totalRounds) {
    showResult();
    return;
  }

  currentRound++;

  if (!firstRoundDone) {
    if (firstRoundQueue.length < 2) {
      firstRoundDone = true;
      return showMatch();
    }

    current = firstRoundQueue.pop();
    next = firstRoundQueue.pop();

  } else {
    const candidates = songs
      .map((s, i) => ({ ...s, i }))
      .filter(s => s.score > 0);

    const pool = candidates.length >= 2
      ? candidates
      : songs.map((s, i) => ({ ...s, i }));

    let a = pool[Math.floor(Math.random() * pool.length)].i;
    let b;

    do {
      b = pool[Math.floor(Math.random() * pool.length)].i;
    } while (a === b);

    current = a;
    next = b;
  }

  songs[current].match++;
  songs[next].match++;

  let remain = totalRounds - currentRound;

  document.getElementById("round").innerText =
    `🔥 ${remain}번 남음`;

  renderThumb("leftPlayer", songs[current]);
  renderThumb("rightPlayer", songs[next]);

  document.getElementById("leftTitle").innerText = songs[current].title;
  document.getElementById("rightTitle").innerText = songs[next].title;
}

function playVideo(side) {
  const song = side === 0 ? songs[current] : songs[next];
  const target = side === 0 ? "leftPlayer" : "rightPlayer";

  document.getElementById(target).innerHTML = `
    <iframe width="100%" height="160"
      src="https://www.youtube.com/embed/${song.id}?autoplay=1"
      allow="autoplay"
      allowfullscreen></iframe>
  `;
}

function pick(choice) {
  if (choice === 0) {
    songs[current].score++;
  } else if (choice === 1) {
    songs[next].score++;
  } else if (choice === 2) {
    const win = Math.random() > 0.5 ? current : next;
    songs[win].score++;
  } else if (choice === 3) {
    songs[current].score++;
    songs[next].score++;
  }

  showMatch();
}

function showResult() {
  const sorted = [...songs].sort((a, b) => {
    const rateA = a.match ? a.score / a.match : 0;
    const rateB = b.match ? b.score / b.match : 0;

    if (rateB !== rateA) return rateB - rateA;
    if (b.score !== a.score) return b.score - a.score;
    if (b.match !== a.match) return b.match - a.match;

    return 0;
  });

  let html = `
    <h2>🏆 전체 순위</h2>
    <table style="margin:20px auto; border-collapse:collapse; width:400px; background:white;">
      <tr style="background:#333; color:white;">
        <th>순위</th>
        <th>곡 제목</th>
        <th>선택</th>
        <th>등장</th>
        <th>승률</th>
      </tr>
  `;

  let rank = 1;

  sorted.forEach((song, i) => {
    if (i > 0) {
      const prev = sorted[i - 1];

      const same =
        (song.score / song.match === prev.score / prev.match) &&
        song.score === prev.score &&
        song.match === prev.match;

      if (!same) rank = i + 1;
    }

    const rate = song.match
      ? ((song.score / song.match) * 100).toFixed(1)
      : 0;

    html += `
      <tr>
        <td>${rank}</td>
        <td>${rank === 1 ? "👑 " : ""}${song.title}</td>
        <td>${song.score}</td>
        <td>${song.match}</td>
        <td>${rate}%</td>
      </tr>
    `;
  });

  html += `</table>`;
  document.getElementById("result").innerHTML = html;
}

showMatch();

</script>

</html>

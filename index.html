<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>owalloil</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: #fafafa;
    color: #222;
    line-height: 1.6;
  }

  header {
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
  }

  nav {
    margin-top: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  nav a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 20px;
  }

  nav a:hover,
  nav a:focus-visible {
    background: #f0f0f0;
    color: #111;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  section {
    margin-bottom: 56px;
  }

  section h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    padding-left: 10px;
    border-left: 4px solid #111;
  }

  .sns-row {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sns-row a {
    display: block;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 14px 16px;
    text-decoration: none;
    color: #222;
    font-size: 14px;
    font-weight: 500;
    transition: border-color 0.15s, background 0.15s;
  }

  .sns-row a:hover,
  .sns-row a:focus-visible {
    border-color: #ccc;
    background: #f7f7f7;
  }

  #calendar .calendar-wrap {
    display: flex;
    justify-content: center;
  }

  #calendar iframe {
    display: block;
    max-width: 100%;
    border-radius: 8px;
  }

  .schedule-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .schedule-list li {
    display: flex;
    gap: 12px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px 14px;
  }

  .schedule-date {
    flex-shrink: 0;
    width: 52px;
    font-size: 12px;
    font-weight: 700;
    color: #666;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .schedule-time {
    font-size: 11px;
    font-weight: 500;
    color: #aaa;
  }

  .schedule-body {
    min-width: 0;
  }

  .schedule-body .schedule-title {
    font-size: 13px;
    font-weight: 600;
    word-break: break-word;
  }

  .schedule-body .schedule-desc {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
    word-break: break-word;
  }

  .schedule-body .schedule-desc a {
    color: #888;
  }

  @media (max-width: 480px) {
    .schedule-date {
      width: 46px;
      font-size: 11px;
    }

    .schedule-time {
      font-size: 10px;
    }

    .schedule-body .schedule-title {
      font-size: 12px;
    }

    .schedule-body .schedule-desc {
      font-size: 11px;
    }
  }

  .schedule-loading,
  .schedule-empty {
    color: #999;
    font-size: 14px;
    background: #fff;
    border: 1px dashed #ccc;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }

  /* ---- 셋리스트 ---- */
  .setlist-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .setlist-item {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 4px 16px;
  }

  .setlist-item summary {
    cursor: pointer;
    list-style: none;
    padding: 14px 0;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .setlist-item summary::-webkit-details-marker {
    display: none;
  }

  .setlist-item summary::after {
    content: '+';
    flex-shrink: 0;
    font-size: 16px;
    font-weight: 400;
    color: #999;
    transition: transform 0.15s;
  }

  .setlist-item[open] summary::after {
    content: '−';
  }

  .setlist-item summary .setlist-date {
    color: #999;
    font-weight: 500;
    margin-right: 8px;
  }

  .setlist-songs {
    list-style: decimal;
    padding: 0 0 16px 20px;
    font-size: 13px;
    color: #444;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  footer {
    text-align: center;
    padding: 24px;
    color: #aaa;
    font-size: 12px;
  }
</style>
</head>

<header>
  <h1>🌟 덕질 사이트</h1>
  <nav>
    <a href="#calendar">캘린더</a>
    <a href="#schedule">일정</a>

    </div>
  </section>

  <section id="schedule">

    <ul class="schedule-list" id="schedule-list">
      <li class="schedule-loading">일정을 불러오는 중...</li>

  </section>

  <section id="setlist">
    <h2>셋리스트</h2>

</main>

<footer>
  made with 💛

<script>
  const GOOGLE_API_KEY = 'AIzaSyCizEquK5yjfW7yRGogF0_yRvOgmQRNrKw';
  const CALENDAR_ID = 'nunguleum093@gmail.com';

  async function loadSchedule() {
    const listEl = document.getElementById('schedule-list');
    const now = new Date().toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
      + `?key=${GOOGLE_API_KEY}&timeMin=${encodeURIComponent(now)}&singleEvents=true&orderBy=startTime&maxResults=10`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('요청 실패: ' + res.status);
      const data = await res.json();
      renderSchedule(listEl, data.items || []);
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<li class="schedule-empty">일정을 불러오지 못했습니다. API 키/캘린더 설정을 확인해주세요.</li>';
    }
  }

  function renderSchedule(listEl, events) {
    if (events.length === 0) {
      listEl.innerHTML = '<li class="schedule-empty">다가오는 일정이 없습니다.</li>';
      return;
    }

    listEl.innerHTML = events.map(function (ev) {
      const rawStart = ev.start.dateTime || ev.start.date;
      const startDate = new Date(rawStart);
      const dateLabel = (startDate.getMonth() + 1) + '.' + startDate.getDate();
      const isAllDay = !ev.start.dateTime;
      const timeLabel = isAllDay ? '종일' : startDate.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      const title = ev.summary || '(제목 없음)';
      const desc = ev.location || ev.description || '';

      return '<li>'
        + '<div class="schedule-date">' + dateLabel + '<span class="schedule-time">' + timeLabel + '</span></div>'
        + '<div class="schedule-body">'
        + '<div class="schedule-title">' + escapeHtml(title) + '</div>'
        + '<div class="schedule-desc">' + desc + '</div>'
        + '</div>'
        + '</li>';
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderSetlists() {
    const containerEl = document.getElementById('setlist-container');
    const sorted = SETLISTS.slice().reverse(); // 최신 공연이 위로 오도록 정렬

    containerEl.innerHTML = sorted.map(function (show) {
      const songsHtml = show.songs.map(function (song) {
        return '<li>' + escapeHtml(song) + '</li>';
      }).join('');

      return '<details class="setlist-item">'
        + '<summary><span><span class="setlist-date">' + escapeHtml(show.date) + '</span>' + escapeHtml(show.title) + '</span></summary>'
        + '<ol class="setlist-songs">' + songsHtml + '</ol>'
        + '</details>';

  document.addEventListener('DOMContentLoaded', renderSetlists);
